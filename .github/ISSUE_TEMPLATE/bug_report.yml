name: Bug report
description: Something in SkeoTrace doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Which role or page?
      options: [Producer, Retailer, Consumer, Admin, Public trace / QR page, API, Setup]
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options: [Live demo, Local setup]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
